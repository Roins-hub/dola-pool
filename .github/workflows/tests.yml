# 每次推送 / PR 自动跑 pytest（Python 3.12，与 Docker 镜像同版本）
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/roins-hub/dola-pool:2.7.12
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check runtime tools
        run: |
          python --version
          node --version
          ffmpeg -version
          ffprobe -version
      - name: Install Python packages
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q tests
