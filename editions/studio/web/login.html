<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071b31">
  <title>登录 · 路过api</title>
  <link rel="preload" href="assets/login-deep-sea/poster.webp" as="image">
  <link rel="stylesheet" href="login-deep-sea.css?v=deep-sea-20261031-r3">
  <script src="login-scene.js?v=deep-sea-20261031-r3" defer></script>
  <script src="login-pointer.js?v=deep-sea-20261031-r3" defer></script>
  <script src="login-auth.js?v=deep-sea-20261031-r3" defer></script>
</head>
<body class="login-deep-sea">
  <main id="stage" class="stage theme-2" data-state="form">
    <div class="scene" aria-hidden="true">
      <video id="sceneVideo" muted loop playsinline preload="metadata" poster="assets/login-deep-sea/poster.webp">
        <source src="assets/login-deep-sea/p3r-menu-loop.mp4" type="video/mp4">
      </video>
    </div>
    <div class="scene-tone" aria-hidden="true"></div>
    <header class="stage-header">
      <a class="brand" href="/login" aria-label="路过api 首页"><span class="brand-mark" aria-hidden="true">路</span><span>路过<span class="brand-api">api</span></span></a>
      <span class="stage-kicker">让想法，成为画面。</span>
    </header>
    <section class="cover-content" aria-labelledby="coverTitle">
      <h1 id="coverTitle">让想法，<br>成为<span>画面。</span></h1>
      <p class="cover-description">一个新的画面，<br>从这里开始。</p>
      <button id="enterBtn" class="primary enter-button" type="button"><span class="entry-label">进入登录</span><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
      <span class="entry-caption">ENTER YOUR CREATIVE SPACE</span>
    </section>
    <section id="loginPanel" class="login-panel" aria-labelledby="title">
      <h1 id="title" class="form-piece">欢迎回来</h1>
      <p id="subtitle" class="form-subtitle sub form-piece">使用邮箱登录，继续你的创作</p>
      <div id="tabs" class="tabs form-piece" aria-label="账号操作" hidden>
        <button type="button" class="on" data-mode="login" aria-pressed="true">登录</button>
        <button type="button" data-mode="register" aria-pressed="false">注册</button>
      </div>
      <form id="authForm" method="post">
        <div class="field form-piece">
          <label for="email">邮箱</label>
          <div class="input-wrap studio-field"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg><input id="email" name="email" type="email" autocomplete="username" placeholder="you@example.com" required></div>
        </div>
        <div class="field form-piece">
          <label for="password">密码</label>
          <div class="input-wrap studio-field"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg><input id="password" name="password" type="password" autocomplete="current-password" placeholder="输入你的密码" required></div>
        </div>
        <div id="inviteRow" class="field form-piece" hidden>
          <label for="invite">邀请码</label>
          <div class="input-wrap studio-field"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 10h8M8 14h4"/></svg><input id="invite" name="invite_code" type="text" autocomplete="off" placeholder="如管理员设置了邀请码"></div>
        </div>
        <div id="err" class="err" role="alert" tabindex="-1" hidden></div>
        <div id="ok" class="ok" role="status" hidden></div>
        <button id="submitBtn" class="primary form-piece" type="submit">登录</button>
      </form>
      <button id="formStatusRetry" class="status-retry" type="button" hidden>重新连接</button>
      <div id="hint" class="hint" hidden></div>
      <p class="foot form-note form-piece">登录后进入与你的账号对应的工作台</p>
      <button id="backBtn" class="back-cover form-piece" type="button">← 返回封面</button>
    </section>
    <footer class="stage-footer"><span>VIDEO CREATION / 路过api</span><span>让想法，成为画面。</span></footer>
    <div id="curtain" class="curtain" aria-hidden="true"></div>
    <p id="sceneStatus" class="live-status" role="status" aria-live="polite"></p>
  </main>
  <noscript><p>请开启浏览器 JavaScript 后登录。</p></noscript>
</body>
</html>
